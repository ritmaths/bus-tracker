<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Bus Stop Tracker</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom smooth pulse animation for live marker */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .bus-active-ring {
            animation: pulse-ring 2s infinite;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Header Navbar -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid font-bold fa-bus text-2xl text-yellow-300"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight" id="routeTitleHeader">Bus Route Tracker</h1>
                    <p class="text-xs text-indigo-200 flex items-center space-x-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-ping"></span>
                        <span id="liveStatusText">Syncing live...</span>
                    </p>
                </div>
            </div>
            <button id="shareButton" class="bg-indigo-700 hover:bg-indigo-800 text-white p-2.5 rounded-full transition-colors flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-yellow-300" title="Share Tracking Link">
                <i class="fa-solid fa-share-nodes text-lg"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">

        <!-- Current Location Summary Box -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 text-center relative overflow-hidden">
            <div class="text-xs uppercase tracking-wider font-semibold text-slate-400 mb-1">Current Bus Position</div>
            <div id="currentBusStopDisplay" class="text-xl font-bold text-indigo-900 min-h-[2rem] flex items-center justify-center">
                <i class="fa-solid fa-spinner fa-spin text-indigo-500 mr-2"></i> Loading route...
            </div>
            <div id="lastUpdatedDisplay" class="text-xs text-slate-500 mt-1">Updated --</div>
            <div class="mt-3 flex justify-center space-x-2">
                <button id="quickNextBtn" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-xs font-semibold px-4 py-2 rounded-xl transition-all shadow-sm flex items-center space-x-1">
                    <i class="fa-solid fa-angles-right"></i>
                    <span>Advance to Next Stop</span>
                </button>
            </div>
        </div>

        <!-- Controls & Action Toolbar -->
        <div class="flex items-center justify-between bg-white p-2 px-3 rounded-xl border border-slate-200 shadow-sm text-xs">
            <button id="editRouteBtn" class="text-slate-600 hover:text-indigo-600 font-medium flex items-center space-x-1 py-1 px-2 rounded hover:bg-slate-50">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>Edit Stops</span>
            </button>
            <button id="resetStatusBtn" class="text-slate-600 hover:text-amber-600 font-medium flex items-center space-x-1 py-1 px-2 rounded hover:bg-slate-50">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Reset Daily Status</span>
            </button>
        </div>

        <!-- Bus Stops Checklist -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
            <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wide mb-3 flex items-center justify-between">
                <span>Stops Sequence</span>
                <span id="progressCount" class="text-xs font-normal text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">0/0 Passed</span>
            </h2>

            <div id="stopsContainer" class="space-y-3 relative">
                <!-- Dynamic bus stops rendered here -->
            </div>
        </div>
    </main>

    <!-- Edit Route / Add Stops Modal -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-4 pb-2 border-b">
                <h3 class="font-bold text-slate-800 text-base">Customize Route & Stops</h3>
                <button id="closeEditModal" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-4 overflow-y-auto flex-1 pr-1">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Route Name</label>
                    <input type="text" id="routeNameInput" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" placeholder="e.g. Route 42 - Downtown Express">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Stops List (One stop per line)</label>
                    <textarea id="stopsListTextArea" rows="8" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 font-sans" placeholder="Depot Main Station&#10;Oak Street&#10;Central Park&#10;Tech Hub&#10;Terminal 1"></textarea>
                    <p class="text-[11px] text-slate-400 mt-1">Stops will follow the order listed here.</p>
                </div>
            </div>

            <div class="mt-4 pt-3 border-t flex space-x-2">
                <button id="cancelModalBtn" class="w-1/2 bg-slate-100 text-slate-700 font-semibold py-2.5 rounded-xl text-xs hover:bg-slate-200 transition-colors">Cancel</button>
                <button id="saveRouteBtn" class="w-1/2 bg-indigo-600 text-white font-semibold py-2.5 rounded-xl text-xs hover:bg-indigo-700 transition-colors shadow-md">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 transform translate-y-20 opacity-0 z-50 flex items-center space-x-2">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage">Action completed</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase configuration resolution
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'daily-bus-stop-tracker';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-api-key",
            authDomain: "demo-app.firebaseapp.com",
            projectId: "demo-app",
            storageBucket: "demo-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Firestore public route document reference (Rule 1 compliance)
        const routeDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'busRouteData', 'currentRoute');

        // State variables
        let currentUser = null;
        let routeData = {
            routeName: 'Daily Commute Route',
            currentStopIndex: -1,
            lastUpdated: Date.now(),
            stops: [
                { id: '1', name: 'Main Bus Terminal', passed: false },
                { id: '2', name: '7th Avenue Junction', passed: false },
                { id: '3', name: 'Central Library', passed: false },
                { id: '4', name: 'City Hospital', passed: false },
                { id: '5', name: 'Tech Park Campus', passed: false }
            ]
        };

        // DOM Element Cache
        const routeTitleHeader = document.getElementById('routeTitleHeader');
        const liveStatusText = document.getElementById('liveStatusText');
        const currentBusStopDisplay = document.getElementById('currentBusStopDisplay');
        const lastUpdatedDisplay = document.getElementById('lastUpdatedDisplay');
        const stopsContainer = document.getElementById('stopsContainer');
        const progressCount = document.getElementById('progressCount');
        const shareButton = document.getElementById('shareButton');
        const quickNextBtn = document.getElementById('quickNextBtn');
        const editRouteBtn = document.getElementById('editRouteBtn');
        const resetStatusBtn = document.getElementById('resetStatusBtn');
        const editModal = document.getElementById('editModal');
        const closeEditModal = document.getElementById('closeEditModal');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const saveRouteBtn = document.getElementById('saveRouteBtn');
        const routeNameInput = document.getElementById('routeNameInput');
        const stopsListTextArea = document.getElementById('stopsListTextArea');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        // Authenticate User
        async function authenticate() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth Error:", err);
            }
        }

        // Initialize App Auth and Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                liveStatusText.innerText = "Live Connected";
                subscribeToRouteUpdates();
            } else {
                authenticate();
            }
        });

        // Subscribe to real-time updates across devices
        function subscribeToRouteUpdates() {
            if (!currentUser) return;

            onSnapshot(routeDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    routeData = docSnap.data();
                    renderApp();
                } else {
                    // Seed initial data if document doesn't exist
                    saveDataToCloud(routeData);
                }
            }, (error) => {
                console.error("Firestore sync error:", error);
                liveStatusText.innerText = "Sync issue";
            });
        }

        // Save current route status to Firestore
        async function saveDataToCloud(newData) {
            if (!currentUser) return;
            try {
                await setDoc(routeDocRef, newData);
            } catch (e) {
                console.error("Error updating route state:", e);
                showToast("Failed to sync updates.");
            }
        }

        function renderApp() {
            // Update Title
            routeTitleHeader.innerText = routeData.routeName || 'Bus Route Tracker';

            // Calculate current bus position
            const currentIndex = routeData.currentStopIndex;
            const stops = routeData.stops || [];

            if (currentIndex >= 0 && currentIndex < stops.length) {
                const currentStop = stops[currentIndex];
                currentBusStopDisplay.innerHTML = `
                    <span class="inline-block bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded-md mr-2 align-middle">CURRENT</span>
                    <span>${escapeHtml(currentStop.name)}</span>
                `;
            } else if (currentIndex >= stops.length && stops.length > 0) {
                currentBusStopDisplay.innerHTML = `
                    <span class="inline-block bg-emerald-100 text-emerald-800 text-xs px-2 py-0.5 rounded-md mr-2 align-middle font-bold">COMPLETED</span>
                    <span>Route finished for today 🎉</span>
                `;
            } else {
                currentBusStopDisplay.innerHTML = `<span class="text-slate-400 font-normal">Bus has not departed yet</span>`;
            }

            // Update timestamp
            if (routeData.lastUpdated) {
                const timeAgo = formatTimeAgo(routeData.lastUpdated);
                lastUpdatedDisplay.innerText = `Last updated: ${timeAgo}`;
            } else {
                lastUpdatedDisplay.innerText = 'Not started yet today';
            }

            // Render passed progress count
            const passedCount = stops.filter(s => s.passed).length;
            progressCount.innerText = `${passedCount}/${stops.length} Passed`;

            // Render Stop List
            stopsContainer.innerHTML = '';
            
            stops.forEach((stop, index) => {
                const isCurrent = (index === routeData.currentStopIndex);
                const isPassed = stop.passed;

                const stopEl = document.createElement('div');
                stopEl.className = `relative flex items-center p-3 rounded-xl border transition-all ${
                    isCurrent 
                        ? 'border-indigo-500 bg-indigo-50/70 shadow-sm' 
                        : isPassed 
                        ? 'border-slate-200 bg-slate-50 opacity-75' 
                        : 'border-slate-200 bg-white hover:border-slate-300'
                }`;

                stopEl.innerHTML = `
                    <!-- Tick/Check box -->
                    <button data-action="toggle-passed" data-index="${index}" class="mr-3 text-lg flex-shrink-0 focus:outline-none">
                        ${isPassed 
                            ? '<i class="fa-solid fa-circle-check text-emerald-600"></i>' 
                            : '<i class="fa-regular fa-circle text-slate-300 hover:text-slate-400"></i>'
                        }
                    </button>

                    <!-- Stop Name & Status -->
                    <div class="flex-1 min-w-0 cursor-pointer" data-action="set-current" data-index="${index}">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-semibold text-slate-400">#${index + 1}</span>
                            <span class="font-medium text-sm text-slate-800 truncate ${isPassed ? 'line-through text-slate-500' : ''}">
                                ${escapeHtml(stop.name)}
                            </span>
                        </div>
                    </div>

                    <!-- Bus location pin / button -->
                    <button data-action="set-current" data-index="${index}" class="ml-2 flex-shrink-0">
                        ${isCurrent 
                            ? '<span class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs font-bold bus-active-ring"><i class="fa-solid fa-bus"></i></span>'
                            : '<span class="text-xs px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium">Set Current</span>'
                        }
                    </button>
                `;

                stopsContainer.appendChild(stopEl);
            });
        }

        // Interaction Event Listeners
        stopsContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;

            const action = btn.dataset.action;
            const index = parseInt(btn.dataset.index, 10);

            if (action === 'toggle-passed') {
                toggleStopPassed(index);
            } else if (action === 'set-current') {
                setBusCurrentStop(index);
            }
        });

        // Toggle passed status of a stop
        function toggleStopPassed(index) {
            const stops = [...routeData.stops];
            stops[index].passed = !stops[index].passed;

            // If checked as passed, and it's the current stop, move current pointer to next stop
            let currentIdx = routeData.currentStopIndex;
            if (stops[index].passed && currentIdx === index) {
                currentIdx = index + 1;
            }

            updateCloudRouteData({ stops, currentStopIndex: currentIdx });
            showToast(stops[index].passed ? `Marked "${stops[index].name}" as passed` : `Unmarked "${stops[index].name}"`);
        }

        // Set bus current location
        function setBusCurrentStop(index) {
            const stops = routeData.stops.map((stop, i) => ({
                ...stop,
                passed: i < index // automatically check off previous stops
            }));

            updateCloudRouteData({
                stops: stops,
                currentStopIndex: index
            });

            showToast(`Bus is now at "${stops[index].name}"`);
        }

        // Advance bus to next stop button
        quickNextBtn.addEventListener('click', () => {
            const stops = routeData.stops;
            let nextIndex = routeData.currentStopIndex + 1;

            if (nextIndex > stops.length) {
                showToast("Already at final destination");
                return;
            }

            const updatedStops = stops.map((stop, i) => ({
                ...stop,
                passed: i < nextIndex
            }));

            updateCloudRouteData({
                stops: updatedStops,
                currentStopIndex: nextIndex
            });

            if (nextIndex < stops.length) {
                showToast(`Advanced to "${stops[nextIndex].name}"`);
            } else {
                showToast("Route completed!");
            }
        });

        // Reset Daily Status
        resetStatusBtn.addEventListener('click', () => {
            const resetStops = routeData.stops.map(stop => ({ ...stop, passed: false }));
            updateCloudRouteData({
                stops: resetStops,
                currentStopIndex: -1
            });
            showToast("Route status reset for a new day!");
        });

        // Helper to update state with timestamp
        function updateCloudRouteData(partialData) {
            routeData = {
                ...routeData,
                ...partialData,
                lastUpdated: Date.now()
            };
            saveDataToCloud(routeData);
        }

        // Modal logic for editing stops
        editRouteBtn.addEventListener('click', () => {
            routeNameInput.value = routeData.routeName || '';
            stopsListTextArea.value = routeData.stops.map(s => s.name).join('\n');
            editModal.classList.remove('hidden');
        });

        function closeModal() {
            editModal.classList.add('hidden');
        }

        closeEditModal.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);

        saveRouteBtn.addEventListener('click', () => {
            const newName = routeNameInput.value.trim() || 'Daily Commute Route';
            const lines = stopsListTextArea.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);

            if (lines.length === 0) {
                showToast("Please enter at least one stop.");
                return;
            }

            // Construct new stops list preserving passed state if names match
            const newStops = lines.map((name, idx) => {
                const existing = routeData.stops.find(s => s.name.toLowerCase() === name.toLowerCase());
                return {
                    id: String(idx + 1),
                    name: name,
                    passed: existing ? existing.passed : false
                };
            });

            updateCloudRouteData({
                routeName: newName,
                stops: newStops,
                currentStopIndex: -1 // Reset position on full edit
            });

            closeModal();
            showToast("Route layout updated successfully!");
        });

        // Share button function
        shareButton.addEventListener('click', () => {
            const shareUrl = window.location.href;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showToast("Share link copied to clipboard!");
                }).catch(() => {
                    copyFallback(shareUrl);
                });
            } else {
                copyFallback(shareUrl);
            }
        });

        function copyFallback(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("Share link copied to clipboard!");
            } catch (err) {
                showToast("Could not copy link.");
            }
            document.body.removeChild(textArea);
        }

        // Helper Functions
        function showToast(msg) {
            toastMessage.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        function formatTimeAgo(timestamp) {
            const diffSeconds = Math.floor((Date.now() - timestamp) / 1000);
            if (diffSeconds < 10) return 'just now';
            if (diffSeconds < 60) return `${diffSeconds} seconds ago`;
            const diffMinutes = Math.floor(diffSeconds / 60);
            if (diffMinutes < 60) return `${diffMinutes} minute${diffMinutes > 1 ? 's' : ''} ago`;
            const hours = Math.floor(diffMinutes / 60);
            return `${hours} hour${hours > 1 ? 's' : ''} ago`;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
```
